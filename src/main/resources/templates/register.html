<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
        input, select { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
<h2>Create an account</h2>

<p th:if="${error}" th:text="${error}" style="color:red"></p>
<p th:if="${param.success}" style="color:green">Registration successful!</p>

<form th:action="@{/register}" method="post">
    <label>Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <label>College</label>
    <input type="text" name="college">

    <label>I am a</label>
    <select name="role">
        <option value="CLIENT">Client (I want to hire)</option>
        <option value="FREELANCER">Freelancer (I want to work)</option>
    </select>

    <button type="submit">Register</button>
</form>
<p>Already have an account? <a th:href="@{/login}">Login</a></p>
</body>
</html>
