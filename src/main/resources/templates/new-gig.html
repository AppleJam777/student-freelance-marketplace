<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post a Gig</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
<h2>Post a new gig</h2>

<form th:action="@{/gigs}" method="post">
    <label>Title</label>
    <input type="text" name="title" required>

    <label>Description</label>
    <textarea name="description" rows="5" required></textarea>

    <label>Budget (₹)</label>
    <input type="number" name="budget" min="1" step="0.01" required>

    <button type="submit">Post gig</button>
</form>

<p><a th:href="@{/dashboard}">Back to dashboard</a></p>
</body>
</html>
